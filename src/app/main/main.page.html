<ion-card>
  <ion-card-header>
    <ion-card-title>Dispositivos</ion-card-title>
  </ion-card-header>

  <ion-card-content>
    <ion-list>
      <ion-item *ngFor="let dispositivo of dipositivos" >
        <ion-thumbnail slot="start">
          <img [src]="dispositivo.img" alt="Imagen del dispositivo">
        </ion-thumbnail>
        <ion-label>
          <h2>{{ dispositivo.nombre }}</h2>
          <p>Estado: Conectado</p>
          <div class="ion-padding">
          
        <ion-item lines="outline" lines="none">
          <ion-select
          label="Opciones..."
          interface="popover"
          placeholder="Seleccione una opción"
          (ionChange)="navegar($event)"
          >

          <ion-select-option>Historial</ion-select-option>
          <ion-select-option>Descargar PDF</ion-select-option>

          </ion-select>

         </ion-item>
          </div>
          
        </ion-label>
      </ion-item>
      <ion-item>
        <ion-grid>
          <ion-row style="border-bottom: 2px solid #ccc; font-weight: bold;">
            <ion-col>sensor</ion-col>
            <ion-col>valor</ion-col>
            <ion-col>estado</ion-col>
          </ion-row>
          <ion-row *ngFor="let sensor of sensores">
            <ion-col>{{ sensor.nombre }}</ion-col>
            <ion-col>{{ sensor.valor }}</ion-col>
            <ion-col>
              <ion-badge [color]="sensor.estado === 'bueno' ? 'success' : 'danger'">
                {{ sensor.estado }}
              </ion-badge>
            </ion-col>
          </ion-row>
        </ion-grid>
      </ion-item>
    </ion-list>
  </ion-card-content>
</ion-card>




<!--el botoncito xd -->



</ion-content>


 <ion-fab slot="fixed" vertical="bottom" horizontal="end">
  <ion-fab-button>
    <ion-icon name="add"></ion-icon>
  </ion-fab-button>

  <ion-fab-list aria-label="Soporte" side="top" >
    <ion-fab-button color="tertiary" (click)="goToSupport()">
      <ion-icon name="chatbubble"></ion-icon>
    </ion-fab-button>
    <ion-fab-button color="primary">
      <ion-icon name="help"></ion-icon>
    </ion-fab-button>
    <ion-fab-button color ="success">
      <ion-icon name="add"></ion-icon>
    </ion-fab-button>
  </ion-fab-list>
</ion-fab>


</div>
