<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Olvide mi contraseña</ion-title>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/login"></ion-back-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Olvide mi contraseña</ion-title>
    </ion-toolbar>
  </ion-header>
<div class="input-container">
      <ion-list>
      <ion-item>
        <ion-icon name="mail" slot="start"></ion-icon>
        <ion-input 
          label="Correo electrónico" 
          labelPlacement="floating" 
          type="email" 
          placeholder="Introduce tu correo electrónico">
        </ion-input>
      </ion-item>
      <ion-button expand="block" (click)="sendResetLink()">Enviar Enlace de Restablecimiento</ion-button>
      
    
    </ion-list>
</div>
 
</ion-content>
