<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Login</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Inicio de sesión</ion-title>
    </ion-toolbar>
  </ion-header>

  <div class="login-container">
    <div class="input-container">
      <ion-list>
        <ion-item>
          <ion-icon name="mail" slot="start"></ion-icon>
          <ion-input 
            label="Email" 
            labelPlacement="floating" 
            type="email" 
            [(ngModel)]="user.email"
            placeholder="Introduce tu email">
          </ion-input>
        </ion-item>

        <ion-item>
          <ion-icon name="lock-closed" slot="start"></ion-icon>
          <ion-input 
            label="Contraseña" 
            labelPlacement="floating" 
            type="password" 
            [(ngModel)]="user.password"
            placeholder="********">
          </ion-input>
        </ion-item>
      </ion-list>
    </div> 
    <ion-button expand="block" class="ion-margin-top" color="success" (click)="login()">
      Entrar
    </ion-button>

    <ion-button routerLink="/register" expand="block" class="ion-margin-top">
      Registrarse 
    </ion-button>

    <ion-button fill="clear" routerLink="/forget-password" expand="block" class="ion-margin-top">
      Olvidé mi contraseña
    </ion-button>
  </div>
</ion-content>
